name: Build zevo_memory

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            g++-multilib \
            gcc-multilib \
            libc6-dev-i386 \
            git

      - name: Get Metamod-R headers
        run: |
          git clone --depth 1 https://github.com/theAsmodai/metamod-r.git metamod-r

      - name: Get ReHLDS headers
        run: |
          git clone --depth 1 https://github.com/dreamstalker/rehlds.git rehlds

      - name: Find source
        run: |
          if [ -f "zevo_memory.cpp" ]; then
            echo "SRC=zevo_memory.cpp" >> "$GITHUB_ENV"
          elif [ -f "zevo_memory__1_.cpp" ]; then
            echo "SRC=zevo_memory__1_.cpp" >> "$GITHUB_ENV"
          else
            echo "ERROR: zevo_memory.cpp not found"
            exit 1
          fi

      - name: Build
        run: |
          g++ -m32 \
            -O2 \
            -shared \
            -fPIC \
            -std=gnu++11 \
            -fno-exceptions \
            -fno-rtti \
            -fno-stack-protector \
            -fno-asynchronous-unwind-tables \
            -D_FORTIFY_SOURCE=0 \
            -Dlinux \
            -D__linux__ \
            -I rehlds/rehlds/common \
            -I rehlds/rehlds/dlls \
            -I rehlds/rehlds/engine \
            -I rehlds/rehlds/pm_shared \
            -I rehlds/rehlds/public \
            -I metamod-r/metamod/src \
            "$SRC" \
            -nodefaultlibs \
            -Wl,--as-needed \
            -lc \
            -o zevo_memory_mm_i386.so

      - name: Verify binary
        run: |
          file zevo_memory_mm_i386.so
          echo "Checking ELF architecture..."
          file zevo_memory_mm_i386.so | grep -E "ELF 32-bit.*Intel 80386" || {
            echo "ERROR: Binary is not 32-bit i386"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zevo_memory_mm_i386
          path: zevo_memory_mm_i386.so
          if-no-files-found: error
